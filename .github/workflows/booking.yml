name: Auto Booking Worksite

on:
  schedule:
    # Contoh: Berjalan setiap hari Jumat jam 08:00 WIB (01:00 UTC)
    - cron: '0 1 * * 5'
  workflow_dispatch: # Memungkinkan kamu menjalankan script secara manual via GitHub UI

jobs:
  run-booking:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl playwright

      - name: Install Playwright Browsers
        run: |
          playwright install chromium
          playwright install-deps

      - name: Run Booking Script
        run: python main.py # Sesuaikan dengan nama file python kamu

      - name: Upload Video Recordings
        if: always() # Tetap simpan video meskipun ada yang error/gagal
        uses: actions/upload-artifact@v3
        with:
          name: booking-videos
          path: videos/
          retention-days: 7 # Simpan file video selama 7 hari di GitHub
