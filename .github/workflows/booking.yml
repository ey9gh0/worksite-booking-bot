name: Auto Booking Worksite

on:
  schedule:
    # Contoh: Berjalan setiap hari Jumat jam 08:00 WIB (01:00 UTC)
    - cron: '0 1 * * 5'
  workflow_dispatch: # Memungkinkan tombol run manual di GitHub Actions

jobs:
  run-booking:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl playwright

      - name: Install Playwright Browsers
        run: |
          playwright install chromium
          playwright install-deps

      - name: Run Booking Script
        run: python booking.py # Ubah jika nama file kamu bukan booking.py

      - name: Upload Video Recordings
        if: always() # Tetap simpan video meskipun script mengalami error
        uses: actions/upload-artifact@v4
        with:
          name: booking-videos
          path: videos/
          retention-days: 7
