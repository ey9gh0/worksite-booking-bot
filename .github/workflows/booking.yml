name: Auto Booking Worksite

on:
  schedule:
    # Berjalan setiap hari Jumat jam 08:00 WIB (01:00 UTC)
    - cron: '0 1 * * 5'
  workflow_dispatch: # Memungkinkan tombol run manual di GitHub UI

jobs:
  run-booking:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl playwright

      - name: Install Playwright Browsers
        run: |
          playwright install chromium
          playwright install-deps

      - name: Run Booking Script
        run: python main.py # Sesuaikan jika nama file kamu booking.py

      - name: Upload Single Video Session Artifact
        if: always() # Tetap simpan video meskipun script ada error
        uses: actions/upload-artifact@v4
        with:
          name: full-booking-video-session
          path: videos/
          retention-days: 7
